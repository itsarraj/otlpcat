[package]
name = "otlpcat"
version = "0.1.0"
edition = "2021"
description = "Pretty-prints OTLP/OpenTelemetry trace export JSON as a human-readable span tree, instead of raw nested JSON"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/otlpcat"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "tracing", "observability", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "otlpcat"
path = "src/lib.rs"

[[bin]]
name = "otlpcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
